// Notes:
//	Pulled from my live CS2 settings (userdata/.../730/local/cfg), so this IS my current setup.
//	Loads with the Steam launch option:  +exec autoexec
//
//	Launch options (Steam > CS2 > Properties > Launch Options):
//	  ENABLE_LAYER_MESA_ANTI_LAG=1 %command% +exec autoexec -fullscreen
//	    ENABLE_LAYER_MESA_ANTI_LAG=1  env var, MUST go before %command% or it does nothing (AMD + Mesa anti-lag layer)
//	    +exec autoexec                runs this file on launch
//	    -fullscreen                   overrides the in-game borderless window setting
//	  Dropped, they do nothing in CS2 on Linux:  -novid  -nojoy  +cl_forcepreload 1  -high
//	Video settings (res, MSAA, shadows) live in cs2_video.txt, not here. CS2 ignores most of them from cfgs.
//	Refer to https://developer.valvesoftware.com/wiki/List_of_Counter-Strike_2_console_commands_and_variables


//---- mouse ----
sensitivity                     0.8    // @ 800 dpi, gpro 2
zoom_sensitivity_ratio          1
sensitivity_y_scale             1
m_yaw                           0.022
m_pitch                         0.022
mouse_inverty                   false
// raw input is always on in CS2, and accel is off at the Hyprland level (accel_profile = flat)


//---- crosshair ----
// cyan, no dot, no outline, static (style 4)
cl_crosshairstyle               4
cl_crosshairsize                0.75
cl_crosshairthickness           0.6
cl_crosshair_gap                2
cl_crosshair_length             4
cl_crosshair_thickness          1
cl_crosshairdot                 false
cl_crosshair_t                  false
cl_crosshair_recoil             false
cl_crosshair_drawoutline        0
cl_crosshairalpha               255
cl_crosshaircolor_r             0
cl_crosshaircolor_g             255
cl_crosshaircolor_b             255
cl_crosshaircolor_a             255
cl_crosshairoutline_r           0
cl_crosshairoutline_g           0
cl_crosshairoutline_b           0
cl_crosshairoutline_a           255
cl_crosshair_sniper_width       1
cl_crosshair_screen_height      1080
cl_crosshair_dynamic_splitdist          3
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.9
cl_crosshair_dynamic_maxdist_splitratio 0.4
cl_crosshair_dynamic_spread_limit       255
cl_crosshair_friendly_warning   1
cl_ironsight_usecrosshaircolor  false
cl_ironsight_dot_scale          1
// keep my crosshair while holding nades, show the nade arc crosshair after 2s
cl_grenadecrosshair_keepusercrosshair true
cl_grenadecrosshair_explosive   true
cl_grenadecrosshair_flash       true
cl_grenadecrosshair_smoke       true
cl_grenadecrosshair_fire        true
cl_grenadecrosshair_decoy       true
cl_grenadecrosshairdelay_explosive 2
cl_grenadecrosshairdelay_flash  2
cl_grenadecrosshairdelay_smoke  2
cl_grenadecrosshairdelay_fire   2
cl_grenadecrosshairdelay_decoy  2


//---- viewmodel ----
viewmodel_presetpos             0      // 0 = custom, so the offsets below stick
viewmodel_fov                   68
viewmodel_offset_x              2.5
viewmodel_offset_y              -2
viewmodel_offset_z              -2
cl_prefer_lefthanded            true   // lefty gang


//---- hud ----
hud_scaling                     1
cl_hud_color                    0
cl_color                        4
safezonex                       1
safezoney                       1
hud_showtargetid                true
cl_showloadout                  false
cl_teammate_colors_show         1
cl_teamid_overhead_mode         3
cl_teamid_overhead_colors_show  true
cl_teamid_overhead_fade_near_crosshair 0.5
cl_teamcounter_playercount_instead_of_avatars false
cl_show_clan_in_death_notice    true
cl_weapon_selection_rarity_color false
cl_sniper_show_inaccuracy       true
r_drawtracers_firstperson       true
r_show_build_info               false  // hide build number in the corner
closecaption                    false
// telemetry (top corner stats): ping, fps/frametime, packet loss
cl_hud_telemetry_ping_show              1
cl_hud_telemetry_ping_poor              100
cl_hud_telemetry_frametime_show         2      // 2 = always show fps
cl_hud_telemetry_frametime_poor         100
cl_hud_telemetry_net_misdelivery_show   1
cl_hud_telemetry_net_misdelivery_poor   2
cl_hud_telemetry_net_quality_graph_show 0
cl_hud_telemetry_net_detailed           0


//---- radar ----
cl_radar_scale                  0.7
cl_hud_radar_scale              1
cl_radar_always_centered        true
cl_radar_rotate                 true
cl_radar_icon_scale_min         0.6
cl_radar_scale_dynamic          false
cl_radar_square_with_scoreboard true
cl_radar_square_always          false
cl_hud_radar_background_alpha   0.627
cl_hud_radar_blur_background    true
cl_hud_radar_map_additive       true


//---- gameplay ----
option_duck_method              false  // hold to crouch
option_speed_method             false  // hold to walk
cl_sniper_auto_rezoom           true
cl_sniper_delay_unscope         false
cl_debounce_zoom                true
cl_silencer_mode                0
cl_weapon_stealth_reload_toggle false
cl_use_opens_buy_menu           false
cl_buywheel_nonumberpurchasing  false
cl_inventory_radial_immediate_select true
cl_inventory_radial_tap_to_cycle true
cl_radial_radio_tap_to_ping     true
cl_use_last_selected_weapon_slot_position false
hud_fastswitch                  0
cl_autohelp                     true
cl_dm_buyrandomweapons          true
player_nevershow_communityservermessage 1
spec_usenumberkeys_nobinds      true
// client-side hit prediction (blood/headshot fx before server confirms, ragdolls on predicted kills)
cl_predict_body_shot_fx         false
cl_predict_head_shot_fx         false
cl_predict_kill_ragdolls        true


//---- binds ----
// only the ones I changed from default
unbind  "TAB"
bind    "MOUSE4"        "+showscores"
bind    "MOUSE5"        "+voicerecord"
bind    "SPACE"         "+jump"
bind    "MWHEELDOWN"    "+jump"
bind    "`"             "toggleconsole"
bind    "-"             "noclip; say .noclip"


//---- audio ----
volume                          0.4
snd_headphone_eq                0
speaker_config                  -1
snd_spatialize_lerp             0
snd_steamaudio_enable_perspective_correction true
snd_mixahead                    0.001
snd_mute_losefocus              true
snd_voipvolume                  1
voice_modenable                 true
voice_vox                       0      // push to talk
cl_mute_enemy_team              false
// music: quiet menus, no round-start/action music, low everything else
snd_menumusic_volume            0.04
snd_roundstart_volume           0
snd_roundaction_volume          0
snd_roundend_volume             0.16
snd_mapobjective_volume         0.04
snd_tensecondwarning_volume     0.04
snd_deathcamera_volume          0.16
snd_mvp_volume                  0.16
snd_mute_mvp_music_live_players false


//---- network ----
rate                            786432
cl_net_buffer_ticks             0
mm_dedicated_search_maxping     150


//---- performance ----
fps_max                         0      // 0 = uncapped
fps_max_ui                      200
engine_no_focus_sleep           20
r_fullscreen_gamma              2.02


//---- misc ----
con_enable                      true
cl_hide_avatar_images           0
cl_sanitize_player_names        false


//---- practice ----
// type "prac" in console on a local server (Practice > Competitive w/ bots, or map de_mirage)
alias prac "sv_cheats 1; mp_warmup_end; mp_freezetime 0; mp_roundtime_defuse 60; mp_buy_anywhere 1; mp_buytime 9999; mp_maxmoney 60000; mp_startmoney 60000; sv_infinite_ammo 1; ammo_grenade_limit_total 5; sv_grenade_trajectory_prac_pipreview 1; sv_showimpacts 1; bot_kick; mp_restartgame 1; echo [autoexec] practice mode on"
alias unprac "sv_cheats 0; sv_infinite_ammo 0; sv_grenade_trajectory_prac_pipreview 0; sv_showimpacts 0; echo [autoexec] practice mode off"


//---- done ----
host_writeconfig
echo " "
echo "autoexec.cfg loaded"
echo " "
